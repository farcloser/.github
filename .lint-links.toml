# Project-local lychee exclusions, merged with the canonical .limen/lychee.toml
# (limen neither pins nor checks this file — it is the project's own).

exclude = [
  # The organization profile lists PRIVATE repositories deliberately, marked
  # with a lock so a reader knows the link needs access. lychee runs
  # unauthenticated — which is the point, it sees what an anonymous visitor
  # sees — so these resolve as 404 and would fail the run.
  #
  # Keep this list in sync with the 🔒 entries in profile/README.md. Adding a
  # line here silences a real check: only ever add a repository that is private
  # ON PURPOSE, never one that is merely broken.
  '^https://github\.com/farcloser/(onboarding|go-vz|zerogravity)$',
]
