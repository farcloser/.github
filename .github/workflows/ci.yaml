# CI for the organization's community-health repository.
#
# The canonical shape — GitHub's own checkout pinned by SHA, aqua for the
# pinned toolchain, and `just` recipes identical to the ones a laptop runs —
# but on a single linux leg. ci.yaml is seeded once and is the project's own
# from there (see book/mandatory-files.md), and this repository ships no code:
# nothing here is platform-dependent, so the five-runner matrix the code
# repositories need would buy nothing but minutes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Single leg, but kept as a matrix so the check-run name stays
        # `verify (ubuntu-24.04)` — the shape the canonical limen:main ruleset
        # names in its required status checks.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left behind in .git/config: nothing in this
          # workflow talks to GitHub after checkout.
          persist-credentials: false
          # Full history: `just do lint commits` validates the commit range
          # against the PR's base branch, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      # aqua's package store, keyed on the exact pins and per architecture
      # (the store holds native binaries). A warm store turns every lazy first
      # use below into a link; the fallback key keeps the tools a pin bump did
      # not touch, and the changed one downloads and verifies as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml', 'aqua-checksums.json', '.limen/aqua-registry.yaml') }}
          restore-keys: |
            aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned tools
        # Not optional: setup-aqua only installs aqua itself and puts its bin
        # directory on PATH — that directory is EMPTY until this runs. The
        # shims created here are what make `just` (and everything the recipes
        # call) resolve at all. Link-only: each tool downloads lazily on first
        # use and is verified against the committed aqua-checksums.json then,
        # so a job only pays for the tools its recipes actually run.
        run: aqua install --only-link

      # The Go build and module caches, plus the linter's (build/cache/, see
      # main.just). The per-platform analysis legs compile the whole module
      # graph five times, cold, on every run without this. Paths come from the
      # pinned go itself — they differ per OS — and the key carries its version
      # and every go.sum; a stale restore is harmless (the build cache is
      # content-addressed, the module cache is checksum-verified), so the
      # fallback key is always worth taking.
      - id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
            build/cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.gocache.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.gocache.outputs.version }}-
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Lint
        run: just lint

      - name: Test
        # A no-op today (the Justfile's `test` recipe is empty) — kept so the
        # shape matches the canonical ci.yaml and tests run the day there are any.
        run: just test

  # Every pin resolves. The verify legs link only, and a link verifies
  # nothing: an asset that is missing from a release, or that fails its
  # checksum, would merge green and fail at first use. One linux leg pays for
  # the real install; aqua's package store is cached on the exact pins, so a
  # warm key costs seconds and a changed pin is always a real install. (The
  # Go-built tools are tools/go.mod directives, built by the verify legs.)
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          # The same key as the verify legs', so this job and the linux leg
          # share one store — and no fallback key here: a changed pin must be
          # a real install, which is what this job exists to prove.
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml', 'aqua-checksums.json', '.limen/aqua-registry.yaml') }}

      - name: Install every pinned tool
        run: aqua install

  # The single required status check, identical to the canonical ci.yaml's.
  # This repository runs one leg where the code repositories run five — which
  # is exactly why the ruleset names this job and not the matrix.
  gate:
    needs: [verify, tools]
    # always(), with the result asserted: without it a failed dependency SKIPS
    # this job, and a skipped required check does not block a merge. tools is
    # asserted alongside verify, so a pin that does not install blocks a
    # merge the same way a failing lint does.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every verify leg and tools succeeded
        env:
          RESULT: ${{ needs.verify.result }}
          RESULT_TOOLS: ${{ needs.tools.result }}
        run: |
          printf 'verify: %s\n' "$RESULT"
          printf 'tools: %s\n' "$RESULT_TOOLS"
          [ "$RESULT" = "success" ] && [ "$RESULT_TOOLS" = "success" ]
